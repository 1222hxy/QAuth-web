<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QAuth 是 device-first authentication engine，为现代应用提供 Passkey、扫码确认、设备绑定、二次验证与可信设备管理。" />
    <link rel="icon" href="/qauth-favicon.svg" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("qauth-theme") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {}
      })();
    </script>
    <title>QAuth - 无密码登录、扫码确认与 Passkey 认证引擎</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
